name: Release Gem

# Only *publishing a GitHub Release* fires this workflow; a bare tag push does
# not. It checks the tag, runs the full CI workflow, then builds, verifies and
# pushes the gem through RubyGems trusted publishing (OIDC). See RELEASING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-gem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails in seconds, before CI runs, when the tag and version.rb disagree: the
  # mismatch that broke the first 0.6.0 publish late at `gem push`.
  verify-tag:
    name: Verify tag matches gem version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.4'

      # The tag is read only through $GITHUB_REF_NAME, never interpolated with ${{ }}.
      - name: Verify tag matches gem version
        run: |
          GEM_VERSION="$(ruby -r ./lib/iron_admin/version -e 'print IronAdmin::VERSION')"
          if [ "${GITHUB_REF_NAME}" != "v${GEM_VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match gem version ${GEM_VERSION} in lib/iron_admin/version.rb (expected tag v${GEM_VERSION}). Bump version.rb (and Gemfile.lock) to match before publishing the Release."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches gem version ${GEM_VERSION}"

  # The same jobs that guard main: Ruby x Rails matrix, minimum deps, RuboCop,
  # gem package check, the host-app gate, and the "CI result" gate. The call
  # grants contents: read, and every job in ci.yml stays within that.
  ci:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish to RubyGems
    needs: [verify-tag, ci]
    # Forks skip publishing, so a fork is a safe place to rehearse a release.
    if: github.repository == 'rubylab-app/iron_admin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # The `release` environment only accepts v* tags, and the RubyGems trusted
    # publisher requires its `environment: release` OIDC claim (see RELEASING.md).
    environment:
      name: release
      url: https://rubygems.org/gems/iron_admin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No bundler-cache: build and push need only RubyGems, and no restored
      # cache enters the job that holds the publishing token.
      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.4'

      - name: Build gem
        run: gem build iron_admin.gemspec

      - name: Verify gem contents
        run: ruby .github/scripts/verify_gem.rb "iron_admin-${GITHUB_REF_NAME#v}.gem" "${GITHUB_REF_NAME#v}"

      - name: Configure trusted publisher credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        run: gem push "iron_admin-${GITHUB_REF_NAME#v}.gem"
