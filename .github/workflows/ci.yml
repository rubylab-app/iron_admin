name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this workflow, so a gem is only published after the same
  # jobs that guard main have passed on the exact release commit.
  workflow_call:

# Least privilege: nothing in CI writes to the repository.
permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its outdated run. Pushes to main and release
  # calls get one group per commit, so they are never cancelled.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
        gemfile: [rails_8_0, rails_8_1]
        include:
          # The single leg that uploads the HTML coverage report.
          - ruby: '3.4'
            gemfile: rails_8_1
            coverage: true
    env:
      # Set at the job level so setup-ruby's `bundle install` and every later
      # step resolve the same Gemfile (see the ruby/setup-ruby README).
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Upload coverage report
        if: ${{ !cancelled() && matrix.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  minimum:
    name: Minimum deps (Ruby 3.3, gemspec floors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pins every runtime dependency to the floor declared in iron_admin.gemspec.
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/minimum.gemfile
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.3' # required_ruby_version floor
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.4'
          # Root Gemfile.lock: the RuboCop version is pinned, so new cops
          # (NewCops: enable) only arrive through a reviewed lockfile bump.
          bundler-cache: true

      # RuboCop skips hidden directories, so .github/scripts is passed explicitly.
      - name: Run RuboCop
        run: bundle exec rubocop . .github/scripts

  package:
    name: Gem package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No bundler-cache: it installs gems into vendor/bundle, which the
      # gemspec's vendor/ glob would pack (the 0.6.0 leak).
      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.4'

      - name: Build gem
        run: gem build iron_admin.gemspec

      - name: Verify gem contents
        run: |
          GEM_VERSION="$(ruby -r ./lib/iron_admin/version -e 'print IronAdmin::VERSION')"
          ruby .github/scripts/verify_gem.rb "iron_admin-${GEM_VERSION}.gem" "${GEM_VERSION}"

  # Proves the packaged gem in a fresh Rails host. Bundler stays out of
  # vendor/bundle: the gemspec's vendor glob would pack those gems.
  # No job permissions. The workflow default is contents: read, and that is
  # all checkout and actions/cache use. release.yml calls this workflow with
  # only contents: read; a job cannot ask for more than the caller grants.
  # The job reads no secrets.
  host-app-gate:
    name: Host-app gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_PATH: ${{ github.workspace }}/tmp/host_app_gate/dev-bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0

      - name: Cache the development and host bundles
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            tmp/host_app_gate/dev-bundle
            tmp/host_app_gate/bundle
          key: host-app-gate-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '.ruby-version') }}
          restore-keys: |
            host-app-gate-${{ runner.os }}-

      - name: Install development gems
        run: bundle install

      - name: Run the passing gate
        run: script/host_app_gate/run

      - name: Naive resource must fail
        run: script/host_app_gate/run --variant naive --expect-failure

      - name: Open authentication must fail
        run: script/host_app_gate/run --variant open_auth --expect-failure

      - name: Broken runner must fail
        run: script/host_app_gate/run --variant broken_runner --expect-failure

  # The only check the "Protect main" ruleset needs to require. Its name stays
  # stable when the matrix changes, unlike the per-leg check names.
  ci-result:
    name: CI result
    # always(), not !cancelled(): GitHub treats a skipped required check as passing.
    if: ${{ always() }}
    needs: [test, minimum, lint, package, host-app-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::At least one CI job did not succeed (${RESULTS})."
              exit 1
            fi
          done
