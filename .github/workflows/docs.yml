# Builds the documentation site in docs/site/ and deploys it to GitHub Pages
# (https://rubylab-app.github.io/iron_admin/). PRs touching docs/ only build;
# deploys run only via a manual "Run workflow" on main. See docs/site/README.md.

name: Docs Site

on:
  # Build-only check on PRs that touch the docs (no deploy).
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # Manual deploy: the ONLY trigger that publishes to GitHub Pages.
  workflow_dispatch:

# Least privilege by default; the deploy job requests what Pages needs.
permissions:
  contents: read

concurrency:
  # One group per PR (new pushes cancel stale builds); deploys share "pages"
  # and are never cancelled mid-deploy.
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          # Same series as the repo's .ruby-version (3.4.9), which this step cannot
          # read from docs/site. A series, not a patch: newer runner images only
          # ship the latest patch of each Ruby series.
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: docs/site

      - name: Configure Pages
        id: pages
        # Only needed when we intend to deploy (manual runs).
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site with Jekyll
        run: bundle exec jekyll build --baseurl "$BASE_PATH"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/iron_admin' }}
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/_site

  deploy:
    # Deploy ONLY on a deliberate manual run from main. Never on push or PR.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
